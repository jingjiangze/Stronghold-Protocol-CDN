name: site

# The CDN documentation site (downcdn.jiangjiangze.icu).
#
# The page reads art.json and mirrors.json live, so the only thing that can go stale is the
# directory table and the offline fallback snapshot — hence a plain redeploy on site changes, a
# daily refresh, and a manual trigger.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'functions/**'
      - 'src/upload.mjs'
      - 'src/site-data.mjs'
      - 'src/packs.mjs'
      - '.github/workflows/site.yml'
  schedule:
    - cron: '43 4 * * *'

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The docs index dates each document with `git log -1`, and the admin page picks the
          # NEWEST one. A shallow clone (the default, depth=1) holds a single commit, so every
          # document reports the same date and "newest" silently degrades into "first after a
          # path tie-break" — observed on the live index on 2026-10-10, before this was set.
          # Full history here is small; it is what makes the choice mean anything.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: unit tests
        run: node --test tests/*.test.mjs

      # Reads the live interface and writes site/data/snapshot.json. It only ever contacts https
      # hosts, and refuses loopback/private/reserved ones.
      # 2026-10-28：R2 只做上传暂存，它的自定义域已解绑，不能再当种子（拿不到就会整步失败）。
      # 种子顺序 = SP_SITE_SEEDS（默认魔搭数据集根）→ 站点自身线上副本；SP_CDN_BASE 只决定
      # 页面里显示的规范地址，不再是唯一数据源。
      - name: snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node src/site-data.mjs
          --base=${{ vars.SP_CDN_BASE || 'https://downcdn.jiangjiangze.icu' }}
          --seeds=${{ vars.SP_SITE_SEEDS || 'https://modelscope.cn/datasets/jingjiangze/Stronghold-Protocol-Assets/resolve/master,https://downcdn.jiangjiangze.icu' }}
          --out=site/data/snapshot.json

      # This zone's /js/* Cache Rule ignores the query string, so ?v= cannot bust it. Rename the
      # files to carry their content hash instead.
      - name: content-hash the site assets
        run: node src/site-hash.mjs --dir=site

      # The admin page's Functions live at the repo root in functions/, and they import the shared
      # src/ modules via ../../../../src/*.mjs. Pages only deploys the directory passed to
      # `wrangler pages deploy` (here: site/), so we copy functions/ AND the src/ modules it reaches
      # into the deploy root, preserving their relative depth — otherwise the live project ships with
      # no Functions and every /api/cdn/upload/* falls through to a Cloudflare 404. (2026-10-12 audit:
      # the admin page was dead precisely because the Functions were never deployed.)
      - name: bundle Functions + their src deps into the deploy root
        run: |
          set -euo pipefail
          mkdir -p site/functions site/src
          cp -r functions/. site/functions/
          cp src/upload.mjs src/docs-index.mjs site/src/
          echo "bundled functions: $(find site/functions -name '*.js' | wc -l) files"

      - name: deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy site \
            --project-name=stronghold-cdn-site \
            --branch=main \
            --commit-dirty=true
