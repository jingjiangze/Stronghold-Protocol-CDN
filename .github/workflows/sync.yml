name: sync

# Manual only for now. The scheduled run is switched on once the write path has been exercised
# against the live bucket; until then this workflow is a read-only reconciliation report.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'upstream tag to mirror (empty = latest release)'
        required: false
        default: ''
      write:
        description: 'true = upload the diff to R2 and publish the interface files'
        type: boolean
        default: false
      pages:
        description: 'true = also deploy the flat tree to Cloudflare Pages (second origin)'
        type: boolean
        default: false
      packs:
        description: 'true = also build zip packs, publish them to R2 and attach them to a GitHub release'
        type: boolean
        default: false
      prune:
        description: 'true = also delete keys upstream no longer lists (dangerous)'
        type: boolean
        default: false
      report_only:
        description: 'true = never fail on the gate; just report (a red run means the CDN is incomplete)'
        type: boolean
        default: false

# gh release create/upload for the pack channel needs to write releases.
permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: unit tests
        run: node --test tests/*.test.mjs

      # Credentials are injected from repository secrets and read from the environment only.
      # The dry-run path needs none of them, so an empty value is harmless.
      - name: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          args=""
          if [ -n "${{ inputs.tag }}" ]; then args="$args --tag=${{ inputs.tag }}"; fi
          if [ "${{ inputs.write }}" = "true" ]; then args="$args --write"; fi
          if [ "${{ inputs.pages }}" = "true" ]; then args="$args --pages"; fi
          if [ "${{ inputs.packs }}" = "true" ]; then args="$args --packs"; fi
          if [ "${{ inputs.prune }}" = "true" ]; then args="$args --prune"; fi
          if [ "${{ inputs.report_only }}" = "true" ]; then args="$args --report-only"; fi
          echo "node src/sync.mjs $args"
          node src/sync.mjs $args

      - name: step summary
        if: always()
        run: |
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-report
          path: |
            report.json
            report.md
          if-no-files-found: warn
          retention-days: 30
