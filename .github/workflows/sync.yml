name: sync

# Automatic: every six hours, plus manual runs.
#
# The scheduled run does the full job (mirror, pages, packs). It is cheap when nothing changed:
# the job reads the interface it published last time and exits in seconds when that interface
# already names the current upstream tag and verified clean — no 428 MB download, no hashing.
#
# Manual runs default to read-only. A red run means the CDN does not match the manifests.
on:
  schedule:
    - cron: '17 1,7,13,19 * * *' # 2026-10-13 统一节奏（原 '17 */6 * * *'）
  workflow_dispatch:
    inputs:
      tag:
        description: 'upstream tag to mirror (empty = latest release)'
        required: false
        default: ''
      write:
        description: 'true = upload the diff to R2 and publish the interface files'
        type: boolean
        default: false
      force:
        description: 'true = ignore the watermark even though the published interface already names this tag (needed to redeploy Pages after a code change: the dist is rebuilt from code, and the watermark compares data, so it cannot see that)'
        type: boolean
        default: false
      pages:
        description: 'true = also deploy the flat tree to Cloudflare Pages (second origin)'
        type: boolean
        default: false
      packs:
        description: 'true = also build zip packs, publish them to R2 and attach them to a GitHub release'
        type: boolean
        default: false
      dropin_only:
        description: 'true = only rebuild the drop-in zip from the published interface (seconds, no tree needed)'
        type: boolean
        default: false
      sources:
        description: 'true = also mirror the extra sources in sources.json (additive)'
        type: boolean
        default: false
      interface_only:
        description: 'true = only re-emit mirrors.json + pick.js from the published contract (seconds)'
        type: boolean
        default: false
      prune:
        description: 'true = also delete keys upstream no longer lists (dangerous)'
        type: boolean
        default: false
      report_only:
        description: 'true = never fail on the gate; just report (a red run means the CDN is incomplete)'
        type: boolean
        default: false

# gh release create/upload for the pack channel needs to write releases. `actions: write` is for the
# site refresh below: it dispatches another workflow (`workflow_dispatch` is the documented
# exception to "events from GITHUB_TOKEN do not start runs").
permissions:
  contents: write
  actions: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: unit tests
        run: node --test tests/*.test.mjs

      # The pack channel and the drop-in zip shell out to zip. A previous version of this step
      # piped `zip --version` into head, which masked the missing binary and let the job fail later.
      - name: tools
        run: |
          set -euo pipefail
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zip
          fi
          command -v zip
          zip --version | head -2
          command -v unzip

      # Credentials are injected from repository secrets and read from the environment only.
      # The dry-run path needs none of them, so an empty value is harmless.
      - name: sync
        env:
          # 2026-10-14：主 CDN 门牌 = speedcdn（仓库变量；缺省仍回退 weishucdn）。
          # 这行让「清单绝对 URL / drop-in 基址」等随本仓发布的产物都带 speedcdn，别再改回旧门牌。
          SP_CDN_BASE: ${{ vars.SP_CDN_BASE || 'https://downcdn.jiangjiangze.icu' }}
          # 素材基址与接口基址不是同一个域：接口在站点（downcdn，带 cdn/v1 与 data 的同源副本），
          # 素材在数据集（downcdn 只为 /assets/** 回 SPA 兜底）。混成一个变量会让清单与验收探针
          # 一起指错 —— 实测 18676/18678 个 URL 报 size-unresolved。
          SP_ASSET_BASE: ${{ vars.SP_ASSET_BASE || 'https://modelscope.cn/datasets/jingjiangze/Stronghold-Protocol-Assets/resolve/master/releases/v1-trial' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # A scheduled run has no inputs, so it does the full job; manual runs use the inputs.
          scheduled=${{ github.event_name == 'schedule' && 'true' || 'false' }}
          want() { [ "$1" = "true" ] && echo true || echo false; }
          args=""
          if [ -n "${{ inputs.tag }}" ]; then args="$args --tag=${{ inputs.tag }}"; fi
          if [ "$(want "${{ inputs.write }}")" = "true" ] || [ "$scheduled" = "true" ]; then args="$args --write"; fi
          if [ "$(want "${{ inputs.pages }}")" = "true" ] || [ "$scheduled" = "true" ]; then args="$args --pages"; fi
          if [ "$(want "${{ inputs.packs }}")" = "true" ] || [ "$scheduled" = "true" ]; then args="$args --packs"; fi
          if [ "$(want "${{ inputs.sources }}")" = "true" ] || [ "$scheduled" = "true" ]; then args="$args --sources"; fi
          if [ "${{ inputs.dropin_only }}" = "true" ]; then args="$args --dropin-only"; fi
          if [ "${{ inputs.force }}" = "true" ]; then args="$args --force"; fi
          if [ "${{ inputs.interface_only }}" = "true" ]; then args="$args --interface-only"; fi
          if [ "${{ inputs.prune }}" = "true" ]; then args="$args --prune"; fi
          if [ "${{ inputs.report_only }}" = "true" ]; then args="$args --report-only"; fi
          echo "node src/sync.mjs $args"
          node src/sync.mjs $args

      - name: step summary
        if: always()
        run: |
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-report
          path: |
            report.json
            report.md
          if-no-files-found: warn
          retention-days: 30

      # The download page bakes the resolved package names into its deploy-time snapshot, and that
      # snapshot only rebuilds on a site deploy. So a run that moves the download packages must also
      # refresh it, or the page keeps offering the previous release's zips to every visitor who
      # cannot reach api.github.com for the live lookup -- which is exactly the audience this CDN
      # exists for. Without this step nothing ties the two together: the scheduled site run is daily,
      # so a package published at the wrong hour stayed invisible for up to a day.
      # NOTE the condition compares the input as a BOOLEAN. `inputs.write == 'true'` is false here
      # even when the box is ticked: a `type: boolean` input arrives as a real boolean, and GitHub's
      # loose equality turns the string 'true' into NaN, so the comparison silently never matches.
      # (The shell steps can compare to the string, because interpolation renders it as "true".)
      - name: refresh the download page's snapshot
        if: ${{ success() && (inputs.write || github.event_name == 'schedule') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml

      # 2026-10-30：R2 没有公开域名，线上 /cdn/v1/* 是 302 到魔搭数据集；把接口从 R2 搬到数据集
      # 的那一步是 publish-interface，而它此前**只有手动触发**。于是一次成功的 sync 之后，访客读到的
      # art.json / index.json / api.json 仍是上一代（实测 6 天里两者差一整版：数据集 v0.3.1、
      # 源树 v0.3.3）。这一步把「发布成功」和「接口可见」接上，否则修好闸门也看不到新版本。
      - name: publish the interface set to the dataset
        if: ${{ success() && (inputs.write || github.event_name == 'schedule') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-interface.yml

      # 闸门失败时的自愈：如果是「镜像比源树旧」造成的字节不符，踢一轮带 --repair 的镜像链，
      # 下一轮 sync（或紧接的手动重跑）就能过。只对闸门失败动作 —— 下载/凭据/上传类失败踢了没用。
      - name: kick the mirror repair when the acceptance gate failed
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gate_failed=$(node -e "const r=require('./report.json'); process.exit(r && r.verification && r.ok===false ? 0 : 1)" && echo yes || echo no)
          if [ "$gate_failed" != "yes" ]; then
            echo "不是验收闸门失败（report.json 未显示 ok===false），不踢镜像修复"
            exit 0
          fi
          echo "闸门失败：踢一轮镜像修复（git-art-sync --repair → dataset-tree --repair）"
          gh workflow run git-art-sync.yml -f write=true -f repair=true || echo "触发 git-art-sync 失败"
          gh workflow run dataset-tree.yml -f repair=true || echo "触发 dataset-tree 失败"
