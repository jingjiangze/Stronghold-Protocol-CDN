name: git-art-sync

# 把 R2 里**已上线**的后台上传素材补提交进 git 的 assets-raw 分支——git 挂载镜像
# （ghfast / gitcdn / OpenI raw …）拉的是这个分支，不是 R2。2026-10-12 审计实测：hosted.json
# 登记 5,246 个键，只有 1,856 个在 assets-raw 里，缺 3,390 个（约 932 MiB）。本作业补这个缺口。
#
# 频率：一天四次，与 sync（:17 每 6 小时）和 openi-mirror（:47 每 6 小时）错开，避免相互争抢。
# openi-mirror(:37) 推的就是本作业(:06)刚入库的 assets-raw 提交——同窗内先入库再被镜像，留 31 分钟余量。
#
# 预算：首轮积压 932 MiB，按 700 MiB/轮排，两轮排干，之后每轮几秒（没有新内容就直接退出）。
on:
  schedule:
    - cron: '6 1,7,13,19 * * *' # # 2026-10-13 链式错峰：同日 4 窗（1,7,13,19 UTC）内序 promote:01→git-art:06→sync:17→openi:37→prune:43→rank:51；快镜像族先吃新字节，rank 收尾重测
    #   紧随 promote(:01)：新字节入 assets-raw → jsdelivr/gitcdn/ghfast 三个拉取式快源即刻可见（实测每轮 14–22 分钟，:28 前完成）
  workflow_dispatch:
    inputs:
      write:
        description: 'true = 真的提交并推送 assets-raw'
        type: boolean
        default: false
      max_bytes:
        description: '单轮字节预算（MiB）'
        type: number
        default: 700

permissions:
  contents: write
  actions: write   # 链发下游镜像（openi / ModelScope）需要 workflow dispatch 权限

concurrency:
  group: git-art-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 字节只在桶里；孤儿分支默认不会被 checkout 带上，脚本自己会 fetch，这里先保证身份可用。
      - name: git identity
        run: |
          git config user.name "stronghold-cdn-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: unit tests (plumbing)
        run: node --test tests/git-art-sync.test.mjs

      - name: note assets-raw head (before)
        id: before
        run: echo "head=$(git ls-remote origin refs/heads/assets-raw | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: sync hosted art into assets-raw
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # A scheduled run has no inputs, so it writes; a manual dispatch writes only when asked.
          # Without this the cron would four times a day print a dry-run report and sync nothing.
          scheduled=${{ github.event_name == 'schedule' && 'true' || 'false' }}
          args=""
          if [ "${{ inputs.write }}" = "true" ] || [ "$scheduled" = "true" ]; then args="$args --write"; fi
          node src/git-art-sync.mjs $args --max-bytes=${{ inputs.max_bytes || 700 }}

      # 2026-10-14：git 链是素材树的唯一中枢 —— 落完 commit 就链发下游多源，不再等各自 6 小时定时窗。
      # 只有 assets-raw 真的前进才链发（否则下游要白拉一遍 ~650 MB 的树）；两条下游都幂等。
      - name: chain downstream mirrors (openi / modelscope)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          after=$(git ls-remote origin refs/heads/assets-raw | cut -f1)
          if [ "$after" = "${{ steps.before.outputs.head }}" ]; then
            echo "assets-raw 未变（本轮无新内容），不链发下游"; exit 0
          fi
          gh workflow run openi-mirror.yml -f write=true \
            && echo "已触发 openi-mirror(write=true)" || echo "触发 openi-mirror 失败（定时兜底）"
          gh workflow run mirror-modelscope.yml \
            && echo "已触发 mirror-modelscope" || echo "触发 mirror-modelscope 失败（定时兜底）"
