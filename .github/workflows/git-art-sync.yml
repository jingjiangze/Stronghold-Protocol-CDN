name: git-art-sync

# 把 R2 里**已上线**的后台上传素材补提交进 git 的 assets-raw 分支——git 挂载镜像
# （ghfast / gitcdn / OpenI raw …）拉的是这个分支，不是 R2。2026-10-12 审计实测：hosted.json
# 登记 5,246 个键，只有 1,856 个在 assets-raw 里，缺 3,390 个（约 932 MiB）。本作业补这个缺口。
#
# 2026-10-16 追加第二腿（art-tree-fill）：上面这个 todo 只来自 main 里的 hosted.json，
# **结构上补不了上游素材树**——0.3.0 实测缺口 13,609 键 / 225.5 MiB（assets/audio 988 +
# assets/ui 37 + assets/local 12,584），全在 R2（sync.mjs 已发布、19,708 URL 验证 0 missing），
# 但没有任何作业会把它们补进 assets-raw，于是 jsdelivr/gitcdn/ghfast 与链发的 openi/魔搭数据集
# 对 0.3.0 全部滞后。src/art-tree-fill.mjs 是全仓唯一能补上游树缺口的工具，此前没有任何
# workflow 调用它（只能本机手动跑，而本机没有 R2 S3 凭据）。挂进本作业后：CI 有凭据 →
# 走 S3 内网取字节；head 前进 → 下面的链发步自动把下游带上。
#
# 预算口径：上游 release 与 hosted 缺口各自有预算；fill 默认 220 MiB/1200 份每轮，
# 排干型积压靠窗口滚动收敛，不赌单轮。
#
# 频率：一天四次，与 sync（:17 每 6 小时）和 openi-mirror（:47 每 6 小时）错开，避免相互争抢。
# openi-mirror(:37) 推的就是本作业(:06)刚入库的 assets-raw 提交——同窗内先入库再被镜像，留 31 分钟余量。
#
# 预算：首轮积压 932 MiB，按 700 MiB/轮排，两轮排干，之后每轮几秒（没有新内容就直接退出）。
on:
  schedule:
    - cron: '6 1,7,13,19 * * *' # # 2026-10-13 链式错峰：同日 4 窗（1,7,13,19 UTC）内序 promote:01→git-art:06→sync:17→openi:37→prune:43→rank:51；快镜像族先吃新字节，rank 收尾重测
    #   紧随 promote(:01)：新字节入 assets-raw → jsdelivr/gitcdn/ghfast 三个拉取式快源即刻可见（实测每轮 14–22 分钟，:28 前完成）
  workflow_dispatch:
    inputs:
      write:
        description: 'true = 真的提交并推送 assets-raw'
        type: boolean
        default: false
      repair:
        description: 'true = 同时修复「路径已在但体积变了」的文件（上游改过的内容）'
        type: boolean
        default: false
      max_bytes:
        description: '单轮字节预算（MiB）'
        type: number
        default: 700

permissions:
  contents: write
  actions: write   # 链发下游镜像（openi / ModelScope）需要 workflow dispatch 权限

concurrency:
  group: git-art-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 2026-10-16：30→45 分钟。第二腿（fill）在上游大版本落地时要按预算取回缺口字节
    # （S3 并发 8），0.3.0 那轮 225 MiB 实测要十几分钟；两腿 + 链发都在这个窗口里。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 字节只在桶里；孤儿分支默认不会被 checkout 带上，脚本自己会 fetch，这里先保证身份可用。
      - name: git identity
        run: |
          git config user.name "stronghold-cdn-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: unit tests (plumbing)
        run: node --test tests/git-art-sync.test.mjs

      - name: note assets-raw head (before)
        id: before
        run: echo "head=$(git ls-remote origin refs/heads/assets-raw | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: sync hosted art into assets-raw
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # A scheduled run has no inputs, so it writes; a manual dispatch writes only when asked.
          # Without this the cron would four times a day print a dry-run report and sync nothing.
          scheduled=${{ github.event_name == 'schedule' && 'true' || 'false' }}
          args=""
          if [ "${{ inputs.write }}" = "true" ] || [ "$scheduled" = "true" ]; then args="$args --write"; fi
          node src/git-art-sync.mjs $args --max-bytes=${{ inputs.max_bytes || 700 }}

      # 第二腿：上游素材树的缺口（上面那条的 todo 只来自 hosted.json，看不到上游 release 的新键）。
      # 预算按「一轮排干一个大版本」定：0.3.0 全量缺口实测 225 MiB / 13,609 键，500 MiB/16,000 份
      # 一轮装得下，比它更大的 release 自动分两窗。没有缺口时这一步只做 read-tree+ls-tree，几秒。
      - name: fill upstream art-tree gaps into assets-raw
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # 与上一腿同一语义：定时跑就写，dispatch 只在 write=true 时写。
          # dry 轮也值得跑：它把「上游树缺多少键」打进日志，0.3.0 之前这个数没人看得见。
          scheduled=${{ github.event_name == 'schedule' && 'true' || 'false' }}
          args="--max-bytes=500 --max-files=16000"
          if [ "${{ inputs.write }}" = "true" ] || [ "$scheduled" = "true" ]; then args="--write $args"; fi
          # --repair 默认关：它会把「路径已在、体积不同」的上游改动覆盖进 assets-raw。
          # 关着的时候行为与历史完全一致（只补缺失路径）。
          if [ "${{ inputs.repair }}" = "true" ]; then args="$args --repair"; fi
          node src/art-tree-fill.mjs $args

      # 2026-10-14：git 链是素材树的唯一中枢 —— 落完 commit 就链发下游多源，不再等各自 6 小时定时窗。
      # 只有 assets-raw 真的前进才链发（否则下游要白拉一遍 ~650 MB 的树）；两条下游都幂等。
      - name: chain downstream mirrors (openi / modelscope)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          after=$(git ls-remote origin refs/heads/assets-raw | cut -f1)
          if [ "$after" = "${{ steps.before.outputs.head }}" ]; then
            echo "assets-raw 未变（本轮无新内容），不链发下游"; exit 0
          fi
          # ModelScope 素材树 = **数据集** `releases/v1-trial/**`（dataset-tree.yml，2026-10-15 并行会话新建）。
          # 旧的 mirror-modelscope.yml（创空间 cdn 分支）被平台 1.6 GB 仓库上限硬拒（实测树 2.36 GB），
          # 已手动 disabled —— 别再往它发。
          gh workflow run dataset-tree.yml \
            && echo "已触发 dataset-tree（魔搭数据集整树）" || echo "触发 dataset-tree 失败（定时兜底）"
          gh workflow run openi-mirror.yml -f write=true \
            && echo "已触发 openi-mirror(write=true)" || echo "触发 openi-mirror 失败（定时兜底）"
