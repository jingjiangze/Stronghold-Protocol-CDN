name: dataset-tree

# 把 GitHub `assets-raw` 分支的整棵素材树镜像到 **魔搭数据集**
# `jingjiangze/Stronghold-Protocol-Assets@master:releases/v1-trial/`。
#
# 为什么必须有这条链（2026-10-15 实测）：容器（魔搭创空间）把数据集当首选源，2026-10-13
# 抽样实测只覆盖 **53%**。根因不是平台拒收 —— 全仓原本只有 `push-rank-modelscope.mjs`
# 会写这个数据集，而它只碰 `cdn/v1/rank.json` 一个路径；素材树是当初一次性灌入后停更，
# 上游 `assets-raw` 自己补齐后也不会自动流过来。
# **2026-10-15 已补齐**：本作业首轮跑通后，源树 34,741 条路径中 34,740 条已可达（14 份抽下载
# 逐字节 sha256 与源 ref 一致），唯一缺口见 tools/push-dataset-tree.mjs 的 PLATFORM_REJECTED。
#
# 与另外两条魔搭链的分工（三条互不相干，别混）：
#   mirror-modelscope.yml  → 创空间 `cdn` 分支（整树；脚本只在 feat/modelscope-mirror 上，未合 main）
#   rank.yml               → 数据集 `cdn/v1/rank.json`（单文件，一天四次）
#   本作业                  → 数据集 `releases/v1-trial/**`（整棵素材树）
#
# 分批：整树 30k 份 / 3.3 GiB，一次推必然超时。每轮按 max_bytes / max_files 提交一批，
# 跑完仍有剩余就退出码 3，同一窗内再跑一轮（steps 顺序执行）。实测单轮 6000 份 / 897 MiB
# 约 2 分钟（含 push），8 轮足以排干首轮积压。
# 幂等：脚本先比对父提交树，字节没变就跳过 push。
#
# 2026-10-15 起改走 **LFS**（详见 tools/push-dataset-tree.mjs 顶部说明）：数据集的对象库
# 已被原始字节撑到上限（repo size 1784479944 > max 1600000000，pre-receive 连拒 18 次），
# 而 1.6 GB 这条线只量 git 对象、不含 LFS 存量。命中 .gitattributes LFS 表的文件现在只写
# 130 B 指针、真实字节走 `git lfs push`。⚠ `*.zip` 仍按原始字节进对象库（数据集的 LFS 表
# 里没有它），所以 max_bytes 的预算仍要按真实体积算，不能按"反正走 LFS"放松。
#
# 全流程走索引层（`cat-file --batch` 读源 blob → `hash-object -w` 写对象库 →
# `update-index --index-info` 挂 index → `write-tree` → `commit-tree` → push），
# clone 用 `--no-checkout`，不落工作树 —— 否则 `git add` 会报 "not in the current sparse checkout"。
#
# 2026-10-15 补低频兜底 cron：本作业原先**只有 workflow_dispatch**，靠 git-art-sync.yml:76-91
# 在 assets-raw 前进时链发。那条链有两个盲区：① `gh workflow run` 网络抖动就静默失败（脚本
# 只 echo "触发失败（定时兜底）"，而本作业自己没有定时，等于没有兜底）；② 若素材树因平台
# 审核等原因出现缺口，而 assets-raw 恰好没前进，就没人再触发，缺口要挂到下一次前进。
# cron 放在 **21:00 UTC 每天一次**：同日链的窗是 01/06/17/37/43/51（promote→git-art→sync→
# openi→prune→rank），21 点不与任何一窗重叠，也避开整点的 GitHub 调度高峰。
# 空跑成本极低：脚本第一件事就是比对父提交树，无差异即 exit 0（不 clone 全树之后的任何
# 写入，只在判定阶段读一次 ls-tree），所以一天一次的探空不会显著消耗额度。
on:
  schedule:
    - cron: '0 21 * * *'   # 每天 21:00 UTC 兜底；链式触发仍由 git-art-sync 即时完成
  workflow_dispatch:
    inputs:
      max_bytes:
        description: '单轮字节预算（MiB）'
        type: number
        default: 400
      max_files:
        description: '单轮文件数预算'
        # 2026-10-16：1500→400。魔搭平台 `legacy_scan` 按**文件数**拒收（实测 1500 份/35 MiB 被拒、
        # 400 份与 490 份通过 —— 与字节数无关，35 MiB 的 LFS 指针批也被拦），pre-receive hook 回
        # `result=REJECTED legacy_exit=1`。默认值必须落在通过侧，否则整条链每次 head 前进都全红。
        type: number
        default: 400
      repair:
        description: 'true = 同时修复「路径已在但体积变了」的文件（上游改过的内容）'
        type: boolean
        default: false
      rounds:
        description: '本次运行最多跑几轮'
        type: number
        default: 6

permissions:
  contents: read
  actions: write   # 跑满轮数仍没排干时，自己再触发一次本作业续跑

concurrency:
  group: dataset-tree
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 2026-10-15 起素材走 LFS：runner 镜像自带 git-lfs，但不显式装就等于赌默认值；
      # 缺了它 push 会报 "'git-lfs' is not a git command"（或更糟——lfs push 静默不执行）。
      - name: ensure git-lfs
        run: |
          git lfs version || { sudo apt-get update -qq && sudo apt-get install -y -qq git-lfs; }
          git lfs version

      # 素材树在孤儿分支 assets-raw 上，checkout 不会带它；脚本从本机 git 对象读字节之前先 fetch。
      - name: fetch assets-raw
        run: git fetch origin assets-raw:refs/heads/assets-raw

      - name: git identity
        run: |
          git config --global user.name cdn-bot
          git config --global user.email cdn-bot@users.noreply.modelscope.cn
          git config --global init.defaultBranch master

      # 凭据是仓库 secret，本机没有；缺失时只警告不失败 —— 数据集是加速源，不能让它把 CI 带红。
      - name: push asset tree to the modelscope dataset
        id: push
        env:
          MODELSCOPE_URL: ${{ secrets.MODELSCOPE_DATASET_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${MODELSCOPE_URL}" ]; then
            echo "::warning:: MODELSCOPE_DATASET_URL 未配置，跳过数据集素材树推送"
            exit 0
          fi
          # 退出码 3 = 还有剩余（正常分批续跑），只有跑满轮数仍有剩余才报 error 收尾。
          # 之前直接 `exit $code` 会把 3 传成 job failure —— 实测首轮已成功推 1200 份。
          # ⚠ step 默认 `bash -e`：node 退出 3（有剩余，正常）会直接终止 step，循环走不到
          # `last=$?`（实测 38612937265 在 round 1 推成 6000 份后被 -e 打断）。
          # 但也不能写 `cmd || true` —— `||` 会把 $? 抹成 0（实测 38614298983 推送撞车却报
          # "数据集已与源树一致"）。正解：用 `if` 包裹，`set +e` 只在判定期间临时关 -e。
          set +e
          last=0
          rounds_run=0
          for i in $(seq 1 ${{ inputs.rounds || 6 }}); do
            echo "=== round $i $(date -u +%H:%M:%S) ==="
            # --migrate-lfs 已于 2026-10-16 完成一次性迁移（38910589078 round 1），后续不再需要：
            # 再跑会摘出已迁移的路径 → 重推相同指针 → tree 不变 → exit 0 → workflow 误停
            # （run 38915991675 round 1 实测）。如需重新迁移，手动 dispatch 传 --migrate-lfs。
            repair_flag=""
            # 2026-10-30 反复：定时轮**不要**自动带 --repair。它在真实数据上会把 todo 放大到远超
            # 单轮预算（实测两次带 repair 的派发分别跑了 75 分钟与 7 小时仍未推出一个 commit，
            # 只能 cancel；而不带 repair 的定时轮历史 9 次全绿）。repair 保留为手动手段：
            # 需要时 dispatch 勾上，并接受「一轮只推进 ≤400 份」。
            if [ "${{ inputs.repair }}" = "true" ]; then repair_flag="--repair"; fi
            if node tools/push-dataset-tree.mjs \
              --max-bytes=${{ inputs.max_bytes || 400 }} \
              --max-files=${{ inputs.max_files || 400 }} $repair_flag; then
              last=0
            else
              last=$?
            fi
            rounds_run=$i
            echo "  (exit=$last)"
            if [ $last -eq 0 ]; then echo "数据集已与源树一致"; break; fi
            # 真失败：先把退出码交给 summary step 再退 —— 否则 step 在这里 exit，
            # GITHUB_OUTPUT 一个字都没写，summarize 只能报「未取到退出码」，
            # 1-C 想要的「失败可见」反而失效（step 失败退出码 ≠ summary 能读到的退出码）。
            if [ $last -ne 3 ]; then
              {
                echo "last=$last"
                echo "rounds_run=$rounds_run"
              } >> "$GITHUB_OUTPUT"
              echo "::error:: push-dataset-tree 退出 $last"
              exit $last
            fi
            echo "仍有剩余，继续下一轮"
            sleep 2
          done
          # 把结果交给后面的 summary step —— 只靠 step 退出码的话，「跑满轮数 + 已自触发续跑」
          # 和「真的推完了」在 Actions 列表里长得一模一样，点按钮的人只能翻日志才分得清。
          {
            echo "last=$last"
            echo "rounds_run=$rounds_run"
          } >> "$GITHUB_OUTPUT"
          if [ $last -eq 3 ]; then
            echo "::warning:: 跑满 ${{ inputs.rounds || 6 }} 轮仍有剩余，再次触发本作业继续"
            gh workflow run dataset-tree.yml \
              -f max_bytes=${{ inputs.max_bytes || 400 }} \
              -f max_files=${{ inputs.max_files || 400 }} \
              -f rounds=${{ inputs.rounds || 6 }}
          fi

      # 1-C：完成信号。GitHub 侧可见，不引入任何外部凭据 —— 想推到外部通知需另加 secret，
      # 当前不做。summary 写在 job summary 里，run 列表页点开即可见，不必翻 6 轮日志。
      - name: summarize result
        if: always()
        env:
          LAST: ${{ steps.push.outputs.last }}
          ROUNDS_RUN: ${{ steps.push.outputs.rounds_run }}
        run: |
          set -u
          rounds="${ROUNDS_RUN:-0}"
          case "${LAST:-}" in
            0) state="✅ 已与源树一致";;
            3) state="⏳ 跑满 ${rounds} 轮仍有剩余，已自触发续跑（见下一条 run）";;
            "") state="⚠️ 未取到退出码（凭据缺失或 step 被跳过）";;
            *) state="❌ 失败，退出码 ${LAST}";;
          esac
          {
            echo "### 魔搭数据集素材树同步"
            echo ""
            echo "- 状态：${state}"
            echo "- 实际轮数：${rounds}"
            echo "- 源：assets-raw → releases/v1-trial/**（LFS）"
            echo "- 触发：schedule / workflow_dispatch / git-art-sync 链发"
            echo ""
            echo "平台审核豁免与缺口口径见 \`tools/push-dataset-tree.mjs\` 的 \`PLATFORM_REJECTED\`。"
          } >> "$GITHUB_STEP_SUMMARY"
          # stdout 里也留一份：`>>` 把内容全吞进 summary 文件，日志里反而一行不剩
          # （实测 run 38733399414 的 summarize step stdout 区段为空），验收时无法从日志
          # 证明「summary 真写进去了」。这行让每次运行都在日志里自证，同时让 run 列表页
          # 的折叠预览有内容可看。
          echo "job summary 已写入：${state}（实际轮数 ${rounds}）"
          # 注解只在异常时出现，避免每次 cron 探空都在 run 页面刷一条通知
          case "${LAST:-}" in
            3) echo "::warning:: dataset-tree 跑满 ${rounds} 轮仍有剩余，已自触发续跑";;
            "") echo "::warning:: dataset-tree 未取到退出码（凭据缺失或 step 被跳过）";;
            0) ;;
            *) echo "::error:: dataset-tree 失败，退出码 ${LAST}";;
          esac
