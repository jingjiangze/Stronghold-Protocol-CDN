name: promote-uploads

# 后台上传的发布轮：核对 sha256 → CopyObject 到对外键 → 登记 hosted.json → 刷新浏览面。
#
# 为什么不塞进 sync.yml：sync 每 6 小时一次、要解 428 MB 的上游包。一次人工上传不该等那个，
# 也不该为了登记 3 个文件把整棵树重新哈希一遍。这里只做「claim → 上线」，通常 1–2 分钟。
#
# 节拍是**触发式**：commit / put / remove / kick 四个端点都会当场 dispatch 这一轮
# （Pages secret GH_DISPATCH_TOKEN + GH_REPO）。定时那两条只是兜底 —— 万一触发失败、
# 或者有人绕过接口直接往暂存区放了东西，最迟半小时也会被处理。
# 一轮里到上限就立刻自己补投一轮，把积压连续排干，不让人等定时。
#
# 单轮上限为什么从 20 改掉：**每轮有一大块固定开销**，与处理几份无关 —— checkout + setup-node
# + 单测 + 最后那条 `sync.mjs --interface-only`（重发整个接口与 tree.json）。实测一轮 20 份的
# promote 步骤 65 秒（≈ 2.5 秒/份，≈ 12 份/分钟），于是一个 ~1000 份的补包要排 ~80 分钟。
# 20 份/轮等于把固定开销付了 50 次。每份文件是**各自独立**过闸的（逐字节 sha256 比对、目标键
# 已存在且摘要不同就拒绝），没有跨文件一致性要保护，所以批量纯粹是运行时间旋钮。
#
# 但单纯把份数调大是把「按份数限流」换成「按猜一个份数限流」：真正的边界是下面那条 30 分钟
# 超时，而每份的耗时取决于上传内容（实测 ~150 KB 的素材 ~2.5 秒/份；500 份就已经 ~21 分钟，
# 换成 5 MB 一份则根本跑不完）。所以**单轮由时间预算（默认 1200 秒）先停**，份数只留作兜底。
# 空闲时轮次照样是几秒就结束（没货可做，循环自己退出），长轮只发生在确实有积压的时候。
# 注意：补投那一轮不带任何 input，所以它用的是**这里的默认值** —— 改默认值即可让整条链提速，
# 不需要人工手跑一轮。

on:
  schedule:
    - cron: '9,39 * * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'true = 只报告，不写字节、不改 hosted.json'
        type: boolean
        default: false
      max:
        description: '单轮份数上限（兜底；实际由时间预算先停）'
        type: number
        default: 2000
      budget_seconds:
        description: '单轮时间预算秒数（默认 1200 = 20 分钟，留出 30 分钟作业超时的余量；0 = 不限）'
        type: number
        default: 1200

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-uploads
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 契约层出问题就别碰桶了 —— 与 sync.yml 同一道闸，两边不能一边严一边松。
      - name: unit tests
        run: node --test tests/upload.test.mjs tests/hosted.test.mjs tests/tree-index.test.mjs

      - name: promote
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          # The `|| N` fallbacks and the inputs' `default:` above are the same numbers in two places,
          # because a `default:` cannot read a variable. Change them together: these are what the
          # chained re-dispatch actually uses (it passes no inputs).
          #
          # The count is deliberately far above what fits, so the time budget is what normally stops
          # a round. 1200s against a 30-minute job timeout leaves room for checkout, the unit tests,
          # the manifest commit and the interface republish (~1 min) on top of the promote step.
          max="${{ inputs.max || 2000 }}"
          budget="${{ inputs.budget_seconds || 1200 }}"
          args="--max=${max} --budget-seconds=${budget}"
          if [ "${{ inputs.dry }}" = "true" ]; then args="$args --dry"; fi
          echo "node src/promote-uploads.mjs $args"
          node src/promote-uploads.mjs $args | tee /tmp/promote.log
          pub=$(grep -o 'PUBLISHED_COUNT=[0-9]*' /tmp/promote.log | tail -1 | cut -d= -f2 || echo 0)
          rem=$(grep -o 'REMOVED_COUNT=[0-9]*' /tmp/promote.log | tail -1 | cut -d= -f2 || echo 0)
          pend=$(grep -o 'PENDING_LEFT=[0-9]*' /tmp/promote.log | tail -1 | cut -d= -f2 || echo 0)
          echo "PUBLISHED_COUNT=${pub:-0}" >> "$GITHUB_ENV"
          echo "REMOVED_COUNT=${rem:-0}" >> "$GITHUB_ENV"
          echo "PENDING_LEFT=${pend:-0}" >> "$GITHUB_ENV"
          # 上线或下线任一发生，hosted.json 与浏览面都要跟着走
          echo "CHANGED=$(( ${pub:-0} + ${rem:-0} ))" >> "$GITHUB_ENV"

      # 登记必须进 git：prune 读的是仓库里那份 hosted.json，「谁传的」也要能在提交历史里查到。
      # 桶里已经上线、git 没登记 = 这批字节下一次 prune 会被当镜像残渣删掉，所以这一步失败要让整轮红。
      - name: commit hosted.json
        if: env.CHANGED != '' && env.CHANGED != '0'
        run: |
          set -euo pipefail
          git config user.name "stronghold-cdn-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- hosted.json; then
            echo "hosted.json 没有变化，跳过提交"
            exit 0
          fi
          git add hosted.json
          git commit -m "hosted: 后台发布 ${PUBLISHED_COUNT} 个、下线 ${REMOVED_COUNT} 个（sha256 已逐字节核对）"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push 第 ${attempt} 次没成功，取一次远端再走"
            git fetch origin main
            git rebase origin/main || { echo "rebase 冲突：需要人工并 hosted.json，桶里的字节已变更，先别删"; exit 1; }
          done
          echo "::error::hosted.json 推不上去；桶已变更但登记未进 git，需要人工补提交"
          exit 1

      # 浏览面 tree.json 与派生接口要跟着新内容走；--interface-only 不重下上游包，几十秒。
      - name: republish interface + tree
        if: env.CHANGED != '' && env.CHANGED != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node src/sync.mjs --write --interface-only

      # 触发式排干：本轮没做完（到 --max 上限）就立刻再来一轮，不让人等定时。
      # 只在"确实还有货"时补投，所以不会出现自链空转把免费分钟烧光。
      - name: drain the backlog
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          left="${PENDING_LEFT:-0}"
          echo "剩余待发：${left}"
          if [ "$left" -gt 0 ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/promote-uploads.yml/dispatches" -f ref=main \
              && echo "已补投一轮继续排干" \
              || echo "补投失败（交给下一次定时兜底）"
          else
            echo "没有积压，等下一次触发"
          fi
