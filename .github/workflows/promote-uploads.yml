name: promote-uploads

# 后台上传的发布轮：核对 sha256 → CopyObject 到对外键 → 登记 hosted.json → 刷新浏览面。
#
# 为什么不塞进 sync.yml：sync 每 6 小时一次、要解 428 MB 的上游包。一次人工上传不该等那个，
# 也不该为了登记 3 个文件把整棵树重新哈希一遍。这里只做「claim → 上线」，通常 1–2 分钟。
#
# 节拍是**触发式**：commit / put / remove / kick 四个端点都会当场 dispatch 这一轮
# （Pages secret GH_DISPATCH_TOKEN + GH_REPO）。定时那两条只是兜底 —— 万一触发失败、
# 或者有人绕过接口直接往暂存区放了东西，最迟半小时也会被处理。
# 一轮里到上限（默认 20 份）就立刻自己补投一轮，把积压连续排干，不让人等定时。

on:
  schedule:
    - cron: '9,39 * * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'true = 只报告，不写字节、不改 hosted.json'
        type: boolean
        default: false
      max:
        description: '单轮最多处理多少份上传'
        type: number
        default: 20

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-uploads
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 契约层出问题就别碰桶了 —— 与 sync.yml 同一道闸，两边不能一边严一边松。
      - name: unit tests
        run: node --test tests/upload.test.mjs tests/hosted.test.mjs tests/tree-index.test.mjs

      - name: promote
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          args="--max=${{ inputs.max || 20 }}"
          if [ "${{ inputs.dry }}" = "true" ]; then args="$args --dry"; fi
          echo "node src/promote-uploads.mjs $args"
          node src/promote-uploads.mjs $args | tee /tmp/promote.log
          pub=$(grep -o 'PUBLISHED_COUNT=[0-9]*' /tmp/promote.log | tail -1 | cut -d= -f2 || echo 0)
          rem=$(grep -o 'REMOVED_COUNT=[0-9]*' /tmp/promote.log | tail -1 | cut -d= -f2 || echo 0)
          pend=$(grep -o 'PENDING_LEFT=[0-9]*' /tmp/promote.log | tail -1 | cut -d= -f2 || echo 0)
          echo "PUBLISHED_COUNT=${pub:-0}" >> "$GITHUB_ENV"
          echo "REMOVED_COUNT=${rem:-0}" >> "$GITHUB_ENV"
          echo "PENDING_LEFT=${pend:-0}" >> "$GITHUB_ENV"
          # 上线或下线任一发生，hosted.json 与浏览面都要跟着走
          echo "CHANGED=$(( ${pub:-0} + ${rem:-0} ))" >> "$GITHUB_ENV"

      # 登记必须进 git：prune 读的是仓库里那份 hosted.json，「谁传的」也要能在提交历史里查到。
      # 桶里已经上线、git 没登记 = 这批字节下一次 prune 会被当镜像残渣删掉，所以这一步失败要让整轮红。
      - name: commit hosted.json
        if: env.CHANGED != '' && env.CHANGED != '0'
        run: |
          set -euo pipefail
          git config user.name "stronghold-cdn-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- hosted.json; then
            echo "hosted.json 没有变化，跳过提交"
            exit 0
          fi
          git add hosted.json
          git commit -m "hosted: 后台发布 ${PUBLISHED_COUNT} 个、下线 ${REMOVED_COUNT} 个（sha256 已逐字节核对）"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push 第 ${attempt} 次没成功，取一次远端再走"
            git fetch origin main
            git rebase origin/main || { echo "rebase 冲突：需要人工并 hosted.json，桶里的字节已变更，先别删"; exit 1; }
          done
          echo "::error::hosted.json 推不上去；桶已变更但登记未进 git，需要人工补提交"
          exit 1

      # 浏览面 tree.json 与派生接口要跟着新内容走；--interface-only 不重下上游包，几十秒。
      - name: republish interface + tree
        if: env.CHANGED != '' && env.CHANGED != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node src/sync.mjs --write --interface-only

      # 触发式排干：本轮没做完（到 --max 上限）就立刻再来一轮，不让人等定时。
      # 只在"确实还有货"时补投，所以不会出现自链空转把免费分钟烧光。
      - name: drain the backlog
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          left="${PENDING_LEFT:-0}"
          echo "剩余待发：${left}"
          if [ "$left" -gt 0 ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/promote-uploads.yml/dispatches" -f ref=main \
              && echo "已补投一轮继续排干" \
              || echo "补投失败（交给下一次定时兜底）"
          else
            echo "没有积压，等下一次触发"
          fi
